name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      # Step 1: Force regenerate the native Android tooling files
      - name: Repair Native Android Project structures
        run: flutter create . --overwrite

      # Step 2: Restore your custom main.dart/app.dart so they don't get replaced by the template
      - name: Restore Custom Application Entrypoints
        run: git checkout HEAD -- lib/main.dart lib/app.dart

      # Step 3: Gather dependencies cleanly
      - name: Get dependencies
        run: flutter pub get

      # Step 4: Run the clean compiler compilation
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

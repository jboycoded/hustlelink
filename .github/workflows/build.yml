name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      # Step 1: Fix the broken native Android Gradle configuration wrapper
      - name: Repair Native Android Project structures
        run: flutter create . --overwrite

      # Step 2: RESTORE your real pubspec configuration along with your custom code files
      - name: Restore Custom Code and Configurations
        run: git checkout HEAD -- pubspec.yaml lib/main.dart lib/app.dart

      # Step 3: Fetch all of your real package dependencies cleanly
      - name: Get dependencies
        run: flutter pub get

      # Step 4: Run the production compilation step
      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
